# Test fixtures for pget E2E and integration tests.
# Run: docker compose -f test/fixtures/docker-compose.yml up -d
# Clean: docker compose -f test/fixtures/docker-compose.yml down -v

services:
  # HTTP test server: nginx serving static test files.
  http:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/files:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8880/test.bin"]
      interval: 1s
      timeout: 3s
      retries: 5

  # FTP test server.
  ftp:
    image: fauria/vsftpd
    network_mode: host
    environment:
      FTP_USER: pget
      FTP_PASS: testpass
      PASV_ADDRESS: 127.0.0.1
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
    ports:
      - "2121:21"
      - "21100-21110:21100-21110"
    volumes:
      - ./vsftpd/files:/home/vsftpd/pget
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2121"]
      interval: 1s
      timeout: 3s
      retries: 5
